[general]
supported_version = 1.1,1.100,2.1,3.1,3.5,3.20,3.50
asset_folder_path = ./assets
model_folder_path = ./assets/model

[predict]
;cluster & bbx
dynamic_range = 65535
brightest_percentage = 10
dbscan_eps = 3
dbscan_min_samples = 20
bbox_expand_px = 15
bbox_area_threshold = 200
erosion_factor = 5
;confidence * 10
mask_threshold = 2

[info]
enhancement = false
exposure_factor = 2
;mask_erosion only affect show
mask_erosion = true
overlay = true
bbox_preview = true
bbox_preview_line_width = 0.5
show_cluster = false
show_brightest_point = false
show_iou = true
iou_font = 16

[dino]
config = config/GroundingDINO_SwinT_OGC.py
weights = groundingdino/groundingdino_swint_ogc.pth
; config = config/gdino_dapi_v1_cfg.py
; weights = groundingdino/cleaned_gdino.pth

[cellpose_sam]
checkpoint = cellpose-sam/fish_cellpose_v1.pt

[sam]
checkpoint_dir = sam

[validate]
tif_folder = ./assets/tif/1-50_Hong
to_output = true
output_folder = ./assets/validate_output

[gui]
icon_folder = ./assets/icon

[performance]
gpu_max_workers = 1
